# Uses the latest shared workflow on main; deployment is manual only.
name: Deploy suumo-scraper-job

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-suumo-scraper-job
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: Takusei/gcp-platform/.github/workflows/deploy-cloud-run.yml@main
    with:
      project_id: dev-projects-476011
      region: asia-northeast1
      kind: job
      target: suumo-scraper-job
      registry_repository: realestate-repo
      image_name: suumo-scraper
      build_context: scraper
      dockerfile: scraper/docker/Dockerfile
    secrets:
      workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deploy_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
